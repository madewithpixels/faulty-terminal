<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>faulty-terminal — lift resolve demo</title>
<style>
  :root { --raspberry:#E84F5C; --coral:#F28745; --teal:#3DC096; --slate:#2b464e; }
  html, body { margin:0; height:100%; background:#2b464e; overflow:hidden; }
  .faulty-terminal { position:fixed; inset:0; }

  /* The HTML heart — same structure as the site's .mwp-logo: a 9×7 grid of .pixel */
  .mwp-logo {
    position:fixed; z-index:5; pointer-events:none;
    display:grid; grid-template-columns:repeat(9,16px); grid-template-rows:repeat(7,16px); gap:2px;
    left:0; top:0;
  }
  .mwp-logo .pixel { width:16px; height:16px; border-radius:3px; }
  .pixel.r { background:var(--raspberry); }
  .pixel.c { background:var(--coral); }
  .pixel.t { background:var(--teal); }

  #ui {
    position:fixed; left:16px; bottom:14px; z-index:10; width:min(460px, calc(100vw - 32px));
    font:11px/1.5 ui-monospace, Menlo, monospace; color:#9bb; background:rgba(8,12,16,.86);
    border:1px solid #2a3a40; border-radius:8px; padding:10px 12px; box-sizing:border-box;
  }
  #ui .row { display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-bottom:6px; }
  #ui button { background:rgba(255,255,255,.06); color:#cde; border:1px solid #2a3a40; border-radius:4px;
    font:inherit; padding:3px 9px; cursor:pointer; }
  #ui button:hover { background:rgba(255,255,255,.14); color:#fff; }
  #ui button.on { border-color:#3dc096; color:#3dc096; }
  #ui button.go { border-color:#F28745; color:#F28745; }
  #ui .lbl { color:#567; margin-right:2px; }
  #scrub { width:100%; accent-color:#3dc096; margin:2px 0 4px; }
  #stage { color:#dfe; }
  #knobs { display:none; grid-template-columns:110px 1fr 44px; gap:2px 8px; align-items:center; margin-top:6px; }
  #knobs.open { display:grid; }
  #knobs input { width:100%; accent-color:#F28745; }
  #knobs output { text-align:right; color:#dfe; }
  #ui .hint { color:#456; }
</style>
</head>
<body>
<div class="faulty-terminal"></div>
<div class="mwp-logo" id="logo" style="visibility:hidden"></div>

<div id="ui">
  <div class="row">
    <button class="go" data-a="play">▶ replay</button>
    <span class="lbl">&nbsp;heart</span>
    <button data-pos="centre" class="on">centre</button>
    <button data-pos="top-left">top-left</button>
    <span class="lbl">&nbsp;panel</span>
    <button data-a="panel">` show / hide</button>
  </div>
  <div class="hint">Every control is in the panel: the lift timeline at the top (drag the lanes), then ripple, pulse, field. Hover any control for what it does.</div>
</div>

<script>
  // Build the heart: 9×7, lit cells from the brand mask (r = M, c = W, t = P)
  (function(){
    var masks=[[6,192],[95,496],[95,500],[95,500],[30,244],[24,56],[0,32]];
    var logo=document.getElementById('logo');
    for(var row=0;row<7;row++) for(var col=0;col<9;col++){
      var m=masks[row], code=((m[0]>>col)&1)+(((m[1]>>col)&1)*2);
      var d=document.createElement('div');
      d.className='pixel'+(code===1?' r':code===3?' c':code===2?' t':'');
      logo.appendChild(d);
    }
  })();

  // Place the heart on whole device pixels, as the site's mwpLogoPlace does
  function placeLogo(){
    var logo=document.getElementById('logo'), dpr=window.devicePixelRatio||1;
    var w=9*18-2, h=7*18-2, tl=logo.classList.contains('at-top-left');
    var x=tl ? 220 : innerWidth/2 - w/2, y=tl ? 48 : innerHeight*0.46 - h/2;
    logo.style.left=Math.round(x*dpr)/dpr+'px'; logo.style.top=Math.round(y*dpr)/dpr+'px';
  }
  placeLogo(); addEventListener('resize', placeLogo);
  window.q = new URLSearchParams(location.search);
  window.FaultyTerminalConfig = {
    debugPanel: true,
    softwareFallback: !q.has('sw'),        // ?sw renders even on software WebGL (testing)
    overscan: q.get('overscan') || 'auto',
    // everything else (field, ripple, lift timings) is the engine's own
    // defaults. The pulse is off until a peak is set in the panel.
    logoLift: '#logo'
  };
</script>
<script src="../dist/faulty-terminal.min.js"></script>
<script>
(function(){
  var ft=null, ui=document.getElementById('ui'), logo=document.getElementById('logo');
  function sel(attr,val){ ui.querySelectorAll('['+attr+']').forEach(function(b){ b.classList.toggle('on', b.getAttribute(attr)===String(val)); }); }
  function togglePanel(){ document.dispatchEvent(new KeyboardEvent('keydown',{key:'`'})); }
  ui.addEventListener('click',function(e){
    var b=e.target.closest('button'); if(!b||!ft) return;
    if(b.dataset.a==='play') ft.liftTimeline.play();
    else if(b.dataset.a==='panel') togglePanel();
    else if(b.dataset.pos){
      logo.classList.toggle('at-top-left', b.dataset.pos==='top-left'); placeLogo(); sel('data-pos', b.dataset.pos);
      ft.liftTimeline.relayout(); ft.liftTimeline.play();
    }
  });
  document.addEventListener('faulty-terminal:ready',function(e){
    var inst=e.detail&&e.detail.instance;
    if(ft||!inst||!inst.liftTimeline) { if(inst && inst.static) logo.style.visibility=''; return; }
    ft=inst;
    var p=document.getElementById('ft-debug');
    if(p && p.classList.contains('ft-hidden') && !q.has('nopanel')) togglePanel();
    setTimeout(function(){ ft.liftTimeline.play(); }, 400);
  });
})();
</script>
</body>
</html>
